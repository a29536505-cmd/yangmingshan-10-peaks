name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  # Let an active production deployment finish before the next run.
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Read configured GitHub Pages site
        uses: actions/configure-pages@v5
        with:
          token: ${{ github.token }}
          # Pages is already enabled with Source = GitHub Actions.
          # Initial enablement needs a separate admin-capable token;
          # pages: write does not let GITHUB_TOKEN bootstrap a Pages site.
          enablement: false
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
